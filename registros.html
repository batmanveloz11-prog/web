<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
</head>
<body onload="checarSesion()" class="vh-100" style="background-color: #0a1628;">
    <div class="container mt-5 m-auto text-white p-4 rounded text-center" style="background-color: #111d35; border: 1px solid #1e3a5f; max-width: 400px;">
        <form id="formRegistrar">
            <h2>Registro</h2>
            
            <div class="mb-3">
                <label for="nombre" class="form-label" style="color: #7ea8d4;">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required style="background-color: #0d1e36; border: 1px solid #1e3a5f; color: #e8f0f8;">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label" style="color: #7ea8d4;">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" required style="background-color: #0d1e36; border: 1px solid #1e3a5f; color: #e8f0f8;">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" style="color: #7ea8d4;">Password</label>
                <input type="password" class="form-control" id="password" name="password" required style="background-color: #0d1e36; border: 1px solid #1e3a5f; color: #e8f0f8;">
            </div>
            
            <button type="button" class="btn btn-danger" onclick="registraUsuario()" style="background: linear-gradient(180deg, #1a9bff 0%, #0070dd 100%); border: none; color: #fff;">Registro</button><br>
            <a href="index.html" class="btn btn-link" style="color: #148eff;">Iniciar Sesión</a>
        </form>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/funciones.js"></script>
    <script src="assets/js/appLogin.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
</body>
</html>
