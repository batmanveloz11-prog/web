<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body onload="checarSesion(); cargarContactos();" style="background-color: #0a1628;">
    <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="assets/imagenes/cecytem2.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            CRUD CONTACTOS
        </a>
        <div class="d-flex" role="search">
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" id="usuario" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                    <li><button class="dropdown-item" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i>Cerrar</button></li>
                </ul>
            </div>
        </div> 
    </div>
    </nav>
    <div class="card text-center m-3" style="background-color: #94b2ea; border: 1px solid #0c5cc5;">
    <div class="card-header bg-dark text-white">
        Crud Contactos
    </div>
    <div class="card-body">
        <div class="text-end">
            <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#agregarModal"><i class="bi bi-person-add p-1"></i>Agregar Contacto</button>

        </div>
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <td>Nombre</td>
                <td>Apellido Paterno</td>
                <td>Apellido Materno</td>
                <td>Telefono</td>
                <td>Correo</td>
                <td>Editar</td>
                <td>Eliminar</td>
            </tr>
            </thead>
            <tbody id="registros">
                     
            </tbody>
        </table>

    </div>
    <div class="card-footer text-muted">
        Design by Gabriel
    </div>
    </div>

<!-- Modal AGREGAR-->
    <div class="modal fade" id="agregarModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Agregar Contacto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="formAgregar">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Nombre">
                    </div>
                    <div class="mb-3">
                    <label for="ap" class="form-label">Apellido Paterno</label>
                    <input type="text" class="form-control" id="ap" placeholder="Apellido Paterno">
                    </div>
                    <div class="mb-3">
                    <label for="am" class="form-label">Apellido Materno</label>
                    <input type="text" class="form-control" id="am" placeholder="Apellido Materno">
                    </div>
                    <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" placeholder="Teléfono">
                    </div>
                    <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo" placeholder="example@queso.com">
                    </div>
                    
                </div>
            
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-square-fill p-1"></i>Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="agregarContacto()"><i class="bi bi-bookmark-plus p-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Modal EDITAR-->
    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Editar Contacto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="formEditar">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="enombre" placeholder="Nombre">
                    </div>
                    <div class="mb-3">
                    <label for="ap" class="form-label">Apellido Paterno</label>
                    <input type="text" class="form-control" id="eap" placeholder="Apellido Paterno">
                    </div>
                    <div class="mb-3">
                    <label for="am" class="form-label">Apellido Materno</label>
                    <input type="text" class="form-control" id="eam" placeholder="Apellido Materno">
                    </div>
                    <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="etelefono" placeholder="Teléfono">
                    </div>
                    <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="ecorreo" placeholder="example@queso.com">
                    </div>
                    
                </div>
            
                <div class="modal-footer">
                    <input type="hidden" id="contactoid">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-square-fill p-1"></i>Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="editarContacto()"><i class="bi bi-bookmark-plus p-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
    
    <script src="assets/js/funciones.js"></script>
    <script src="assets/js/appCRUD.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

   
</body>
</html>
